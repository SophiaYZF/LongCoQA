### model
model_name_or_path: models/Qwen/Qwen3.5-9B
trust_remote_code: true
flash_attn: fa2
freeze_vision_tower: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: all
use_rslora: true
loraplus_lr_ratio: 8.0

### data
dataset_dir: artifacts/training
dataset: longcoqa_conversation_train
eval_dataset: longcoqa_conversation_dev
template: qwen3_5_nothink
enable_thinking: false
mask_history: true
cutoff_len: 4096
overwrite_cache: false
preprocessing_num_workers: 32
dataloader_num_workers: 8

### output
output_dir: outputs/training/qwen3_5_9b_conversation_lora
logging_steps: 5
save_steps: 50
eval_steps: 50
save_total_limit: 2
plot_loss: true
overwrite_output_dir: false
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
per_device_eval_batch_size: 2
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
bf16: true
tf32: true
gradient_checkpointing: true
eval_strategy: steps
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
ddp_timeout: 180000000
seed: 42
data_seed: 42
resume_from_checkpoint: null

