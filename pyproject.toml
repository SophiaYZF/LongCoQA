[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "longcoqa-reproduction"
version = "0.1.0"
description = "Reproducible LongCoQA experiments, retrieval, training, and evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
paper-metrics = [
  "bert-score>=0.3.13,<0.4",
  "bleurt-pytorch==0.0.1",
  "huggingface-hub>=0.34,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.4,<3",
  "transformers>=4.45,<5",
]

[project.scripts]
longcoqa = "longcoqa.cli:app"

[tool.setuptools.packages.find]
include = ["longcoqa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "code/base_code"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
